<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>RBXWell — Robux Calculator</title>

<style>
:root {
  color-scheme: dark;
  --bg: #0b0d12;
  --surface: rgba(24, 29, 40, .86);
  --soft: rgba(255,255,255,.045);
  --border: rgba(255,255,255,.10);
  --text: #f2f4fa;
  --muted: #a2acbd;
  --accent: #b9caff;
  --accent-bg: rgba(124,156,255,.10);
  --green: #a7edc4;
  --green-bg: rgba(74,222,128,.07);
  --glow:
    radial-gradient(650px 420px at 0% 0%, #7699ff20, transparent 65%),
    radial-gradient(600px 420px at 100% 10%, #a979ff16, transparent 65%);
}

html[data-theme="amoled"] {
  --bg: #000;
  --surface: #000;
  --soft: #080808;
  --border: #252525;
  --accent: #e5e5e5;
  --accent-bg: #101010;
  --glow: none;
}

html[data-theme="oled"] {
  --bg: #000;
  --surface: rgba(10,10,16,.95);
  --soft: #0d0d16;
  --border: #27243b;
  --accent: #ccbaff;
  --accent-bg: rgba(165,125,255,.10);
  --glow:
    radial-gradient(550px 350px at 100% 0%, #8850ff19, transparent 65%);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100dvh;
  padding: 20px 14px calc(30px + env(safe-area-inset-bottom));
  color: var(--text);
  background: var(--glow), var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, input, select {
  font: inherit;
}

button, select {
  cursor: pointer;
}

button, input, select {
  color: var(--text);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

button:disabled {
  cursor: default;
}

[hidden] {
  display: none !important;
}

.app {
  max-width: 570px;
  margin: auto;
}

.header {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -.5px;
}

.brand-icon {
  display: grid;
  place-items: center;
  width: 29px;
  height: 29px;
  border-radius: 10px;
  background: var(--accent);
  color: #101016;
  font-size: 12px;
  letter-spacing: 0;
}

.clock {
  flex: 1;
  min-width: 0;
  padding: 9px 5px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  text-align: center;
}

.clock-city {
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 10px;
}

.clock-time {
  display: block;
  white-space: nowrap;
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.language {
  width: 105px;
  padding: 12px 6px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  font-size: 12px;
}

option {
  background: #15151c;
  color: #fff;
}

.card {
  margin-bottom: 14px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 25px;
  background: var(--surface);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

.title {
  margin: 0 0 13px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 650;
}

.section-heading .title {
  margin: 0;
}

.segment {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.segment button {
  min-height: 44px;
  padding: 9px 5px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--soft);
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.segment button.active {
  border-color: var(--accent);
  background: var(--accent);
  color: #11131b;
}

.amount-label {
  display: block;
  margin-top: 19px;
}

.amount-wrap {
  position: relative;
}

.amount {
  width: 100%;
  padding: 17px 70px 17px 16px;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: var(--soft);
  font-size: 28px;
  font-weight: 700;
}

.symbol {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-weight: 700;
}

.action {
  min-height: 40px;
  padding: 9px 13px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 650;
}

.action:disabled {
  opacity: .5;
}

.calculate {
  width: 100%;
  margin-top: 11px;
}

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}

.summary-box, .purchase {
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: var(--accent-bg);
}

.label {
  display: block;
  margin-bottom: 7px;
  color: var(--accent);
  font-size: 11px;
  line-height: 1.4;
}

.value {
  font-size: 23px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.note {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.packs {
  display: grid;
  gap: 9px;
}

.pack {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 14px 12px;
  text-align: left;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--soft);
}

.pack:disabled {
  opacity: .55;
}

.pack.best {
  border-color: #69bc8b;
  background: var(--green-bg);
}

.pack.selected {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.pack-icon {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 35px;
  height: 35px;
  border-radius: 11px;
  background: var(--accent-bg);
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
}

.pack-info {
  flex: 1;
  min-width: 0;
}

.pack-name {
  font-size: 16px;
  font-weight: 750;
}

.pack-price, .pack-rate {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

.badge {
  max-width: 100px;
  padding: 6px 8px;
  border-radius: 12px;
  background: var(--green-bg);
  color: var(--green);
  text-align: center;
  font-size: 10px;
  line-height: 1.5;
}

.pack:disabled .badge {
  background: var(--soft);
  color: var(--muted);
}

.purchase {
  margin-top: 15px;
}

.purchase h3 {
  margin: 0 0 12px;
  font-size: 15px;
}

.purchase-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 10px;
  font-size: 13px;
}

.purchase-row span {
  color: var(--muted);
}

.purchase-row strong {
  text-align: right;
}

.remaining {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.remaining .value {
  color: var(--green);
}

.arrows {
  display: flex;
  gap: 6px;
}

.arrow {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--soft);
  font-size: 18px;
}

.plus-track {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 3px 2px 14px;
  scroll-snap-type: x mandatory;
  scroll-padding-inline: 2px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.plus-card {
  flex: 0 0 84%;
  min-width: 0;
  padding: 20px;
  scroll-snap-align: start;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--soft);
}

.plus-card.selected {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.plus-card h3 {
  margin: 0 0 8px;
  font-size: 22px;
}

.plus-price {
  color: var(--accent);
  font-size: 23px;
  font-weight: 800;
}

.plus-card .action {
  width: 100%;
  margin-top: 16px;
}

.plus-robux {
  margin-top: 18px;
  font-size: 17px;
  font-weight: 700;
}

.rate-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
}

.rate-row label {
  color: var(--muted);
  font-size: 13px;
}

.rate-input {
  width: 135px;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--soft);
  text-align: right;
}

.source {
  display: inline-block;
  margin-top: 12px;
  color: var(--accent);
  font-size: 12px;
  line-height: 1.5;
  text-decoration: none;
}

.footer {
  padding: 5px 8px;
  text-align: center;
}

@media (max-width: 390px) {
  .header {
    flex-wrap: wrap;
  }

  .brand {
    flex: 1;
  }

  .clock {
    order: 3;
    flex: 0 0 100%;
  }

  .clock-time {
    font-size: 14px;
  }

  .card {
    padding: 15px;
  }

  .value {
    font-size: 19px;
  }

  .pack-icon {
    display: none;
  }

  .plus-card {
    flex-basis: 93%;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<main class="app">

  <header class="header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">R$</span>
      RBXWell
    </div>

    <div class="clock">
      <div id="clockCity" class="clock-city"></div>
      <time id="clockTime" class="clock-time">—</time>
    </div>

    <select id="language" class="language" aria-label="Language">
      <option value="ru">Русский</option>
      <option value="en">English</option>
      <option value="uk">Українська</option>
      <option value="be">Беларуская</option>
    </select>
  </header>

  <section class="card">
    <h2 class="title" data-t="theme"></h2>
    <div class="segment" id="themes">
      <button type="button" data-theme="glass">Glass</button>
      <button type="button" data-theme="amoled">AMOLED</button>
      <button type="button" data-theme="oled">OLED</button>
    </div>
  </section>

  <section class="card">
    <h2 class="title" data-t="currency"></h2>

    <div class="segment" id="currencies">
      <button type="button" data-currency="BYN">BYN</button>
      <button type="button" data-currency="RUB">RUB</button>
      <button type="button" data-currency="UAH">UAH</button>
    </div>

    <label for="amount" class="title amount-label" data-t="amount"></label>

    <div class="amount-wrap">
      <input
        id="amount"
        class="amount"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        placeholder="0"
      >
      <span id="symbol" class="symbol"></span>
    </div>

    <button id="calculate" type="button"
      class="action calculate" data-t="calculate"></button>

    <div class="summary">
      <div class="summary-box">
        <span class="label" data-t="usd"></span>
        <div id="usdValue" class="value">—</div>
      </div>

      <div class="summary-box">
        <span class="label" data-t="best"></span>
        <div id="bestValue" class="value">—</div>
      </div>
    </div>

    <p id="inputStatus" class="note" role="status"></p>
    <p class="note" data-t="bestHint"></p>
  </section>

  <section class="card">
    <h2 class="title" data-t="packs"></h2>
    <p class="note" data-t="selectHint" style="margin:0 0 14px"></p>
    <div id="packs" class="packs"></div>
    <section id="packPurchase" class="purchase" hidden></section>
  </section>

  <section class="card">
    <div class="section-heading">
      <h2 class="title">Roblox Plus</h2>

      <div class="arrows">
        <button id="plusPrevious" class="arrow" type="button"
          aria-label="Previous">‹</button>
        <button id="plusNext" class="arrow" type="button"
          aria-label="Next">›</button>
      </div>
    </div>

    <p class="note" data-t="swipe" style="margin:0 0 14px"></p>
    <div id="plusTrack" class="plus-track"></div>

    <p class="note" data-t="subscription"></p>
    <section id="plusPurchase" class="purchase" hidden></section>
  </section>

  <section class="card">
    <div class="section-heading">
      <h2 class="title" data-t="rates"></h2>
      <button id="refresh" class="action" type="button"
        data-t="refresh"></button>
    </div>

    <div class="rate-row">
      <label for="rateBYN">1 USD = BYN</label>
      <input id="rateBYN" class="rate-input"
        type="text" inputmode="decimal" placeholder="—">
    </div>

    <div class="rate-row">
      <label for="rateRUB">1 USD = RUB</label>
      <input id="rateRUB" class="rate-input"
        type="text" inputmode="decimal" placeholder="—">
    </div>

    <div class="rate-row">
      <label for="rateUAH">1 USD = UAH</label>
      <input id="rateUAH" class="rate-input"
        type="text" inputmode="decimal" placeholder="—">
    </div>

    <p id="apiStatus" class="note" role="status"></p>
    <p class="note" data-t="rateHint"></p>

    <a class="source"
       href="https://www.exchangerate-api.com"
       target="_blank"
       rel="noopener noreferrer">Rates By ExchangeRate-API</a>
  </section>

  <footer class="footer">
    <p class="note" data-t="footer"></p>
    <a class="source"
       href="https://www.roblox.com/upgrades/robux"
       target="_blank"
       rel="noopener noreferrer"
       data-t="official"></a>
  </footer>

</main>

      insufficient: "Поки не вистачає на найменший пакет.",
      swipe: "Гортай картки вліво та вправо й вибирай підписку.",
      month: "/ місяць",
      monthlyRobux: "Robux щомісяця",
      noRobux: "Без зазначеного щомісячного нарахування Robux",
      benefits: "Переваги Roblox Plus",
      subscription: "Щомісячна підписка з автоподовженням. Нижче розраховується оплата лише одного місяця. Базовий Plus не вважається пакетом Robux.",
      firstMonth: "Залишиться після оплати одного місяця",
      footer: "Сайт, на якому можна дізнатися, на який пакет вам вистачить грошей. Дані про пакети взято із сайту Roblox. Остаточні ціни, доступність і курс банку можуть відрізнятися. Комісії та податки не враховано.",
      official: "Відкрити офіційний сайт Roblox"
    },

    be: {
      theme: "Тэма афармлення",
      currency: "Валюта",
      amount: "Твая сума",
      calculate: "Пералічыць",
      usd: "Бюджэт у доларах",
      best: "Выгадны пакет",
      bestHint: "Рэкамендуем адзін даступны пакет з найбольшай колькасцю Robux за $1. Некалькі пакупак і падпіскі не ўлічваюцца.",
      packs: "Пакеты Robux",
      selectHint: "Выберы даступны пакет, каб убачыць кошт і рэшту.",
      selected: "Выбраная пакупка",
      cost: "Кошт",
      left: "Застанецца пасля куплі",
      available: "Даступна",
      unavailable: "Не хапае",
      value: "Выгадна",
      chosen: "Выбрана",
      select: "Выбраць",
      perDollar: "Robux за $1",
      rates: "Курсы да 1 USD",
      refresh: "Абнавіць",
      loading: "Загружаем курсы…",
      updated: "Курсы крыніцы на",
      cached: "Захаваныя курсы на",
      manual: "Для выбранай валюты выкарыстоўваецца ручны курс.",
      error: "Не ўдалося абнавіць курсы.",
      noRates: "Увядзі курс уручную або націсні «Абнавіць».",
      rateHint: "Курс — колькасць мясцовай валюты за 1 USD. Можна ўвесці курс свайго банка. Абнаўленне заменіць ручныя значэнні курсамі API.",
      invalidAmount: "Увядзі суму не меншую за нуль. Напрыклад: 50 або 50,25.",
      invalidRate: "Для разліку патрэбны курс выбранай валюты большы за нуль.",
      insufficient: "Пакуль не хапае на найменшы пакет.",
      swipe: "Гартай карткі ўлева і ўправа і выбірай падпіску.",
      month: "/ месяц",
      monthlyRobux: "Robux штомесяц",
      noRobux: "Без пазначанага штомесячнага налічэння Robux",
      benefits: "Перавагі Roblox Plus",
      subscription: "Штомесячная падпіска з аўтападаўжэннем. Ніжэй разлічваецца аплата толькі аднаго месяца. Базавы Plus не лічыцца пакетам Robux.",
      firstMonth: "Застанецца пасля аплаты аднаго месяца",
      footer: "Сайт, на якім можна даведацца, на які пакет вам хопіць грошай. Даныя пра пакеты ўзяты з сайта Roblox. Канчатковыя цэны, даступнасць і курс банка могуць адрознівацца. Камісіі і падаткі не ўлічаны.",
      official: "Адкрыць афіцыйны сайт Roblox"
    }
  };

  const CITIES = {
    ru: { zone: "Europe/Moscow", name: "Москва" },
    en: { zone: "America/New_York", name: "Washington, D.C." },
    uk: { zone: "Europe/Kyiv", name: "Київ" },
    be: { zone: "Europe/Minsk", name: "Мінск" }
  };

  const CODES = ["BYN", "RUB", "UAH"];
  const SYMBOLS = { BYN: "Br", RUB: "₽", UAH: "₴" };
  const THEMES = ["glass", "amoled", "oled"];
  const STATE_KEY = "rbxwell-state-v4";
  const CACHE_KEY = "rbxwell-rates-v4";
  const API = "https://open.er-api.com/v6/latest/USD";

  const $ = id => document.getElementById(id);

  function read(key) {
    try {
      return JSON.parse(localStorage.getItem(key));
    } catch (error) {
      return null;
    }
  }

  function write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (error) {
      return false;
    }
  }

  const stored = read(STATE_KEY);
  const saved = stored && typeof stored === "object" ? stored : {};

  let lang = Object.prototype.hasOwnProperty.call(WORDS, saved.lang)
    ? saved.lang : "ru";
  let currency = CODES.includes(saved.currency) ? saved.currency : "BYN";
  let theme = THEMES.includes(saved.theme) ? saved.theme : "glass";
  let selectedPack = saved.selectedPack || null;
  let selectedPlus = saved.selectedPlus || null;

  let source = "";
  let sourceTime = null;
  let loading = false;
  let failed = false;

  const manual = new Set();
  const versions = { BYN: 0, RUB: 0, UAH: 0 };

  let packNodes = [];
  let plusNodes = [];
  let clockFormatter = null;

  function t(key) {
    return WORDS[lang][key] || key;
  }

  function num(value, digits = 2) {
    try {
      return new Intl.NumberFormat(lang, {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      }).format(value);
    } catch (error) {
      return Number(value).toFixed(digits);
    }
  }

  function usd(value) {
    return "$" + num(value);
  }

  function local(value) {
    return num(value) + " " + currency;
  }

  function parseDecimal(text, emptyAsZero = false) {
    const clean = String(text)
      .trim()
      .replace(/[s  ]/g, "")
      .replace(",", ".");

    if (!clean) return emptyAsZero ? 0 : NaN;

    if (!/^(?:d+(?:.d*)?|.d+)$/.test(clean)) return NaN;

    const value = Number(clean);
    return Number.isFinite(value) ? value : NaN;
  }

  function save() {
    const manualRates = {};

    CODES.forEach(code => {
      if (manual.has(code)) {
        manualRates[code] = $("rate" + code).value;
      }
    });

    return write(STATE_KEY, {
      lang,
      currency,
      theme,
      amount: $("amount").value,
      selectedPack,
      selectedPlus,
      manualRates
    });
  }

  function applyTheme() {
    document.documentElement.dataset.theme = theme;

    document.querySelectorAll("#themes button").forEach(button => {
      const active = button.dataset.theme === theme;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });

    document.querySelector('meta[name="theme-color"]')
      .setAttribute("content", theme === "glass" ? "#0b0d12" : "#000000");
  }

  function applyCurrency() {
    document.querySelectorAll("#currencies button").forEach(button => {
      const active = button.dataset.currency === currency;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });

    $("symbol").textContent = SYMBOLS[currency];
  }

  function configureClock() {
    $("clockCity").textContent = CITIES[lang].name;

    const options = {
      timeZone: CITIES[lang].zone,
      numberingSystem: "latn",
      day: "2-digit",
      month: "2-digit",
      year: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    };

    try {
      clockFormatter = new Intl.DateTimeFormat("en-GB", options);
    } catch (error) {
      try {
        if (lang !== "uk") throw error;
        options.timeZone = "Europe/Kiev";
        clockFormatter = new Intl.DateTimeFormat("en-GB", options);
      } catch (fallbackError) {
        clockFormatter = null;
      }
    }

    updateClock();
  }

  function updateClock() {
    if (!clockFormatter) {
      $("clockTime").textContent = "—";
      return;
    }

    try {
      const now = new Date();
      const parts = {};

      clockFormatter.formatToParts(now).forEach(part => {
        parts[part.type] = part.value;
      });

      $("clockTime").textContent =
        `${parts.day}:${parts.month}:${parts.year} ` +
        `${parts.hour}:${parts.minute}:${parts.second}`;

      $("clockTime").dateTime = now.toISOString();
    } catch (error) {
      $("clockTime").textContent = "—";
    }
  }

  function buildPacks() {
    $("packs").textContent = "";

    packNodes = PACKS.map(pack => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "pack";

      button.innerHTML = `
        <span class="pack-icon" aria-hidden="true">R$</span>
        <div class="pack-info">
          <div class="pack-name"></div>
          <div class="pack-price"></div>
          <div class="pack-rate"></div>
        </div>
        <span class="badge"></span>
      `;

      button.querySelector(".pack-name").textContent =
        num(pack.robux, 0) + " Robux";

      button.querySelector(".pack-rate").textContent =
        num(pack.robux * 100 / pack.cents, 1) + " " + t("perDollar");

      button.addEventListener("click", () => {
        selectedPack = pack.id;
        calculate();
        save();
      });

      $("packs").appendChild(button);

      return {
        pack,
        button,
        price: button.querySelector(".pack-price"),
        badge: button.querySelector(".badge")
      };
    });
  }

  function buildPlus() {
    $("plusTrack").textContent = "";

    plusNodes = PLUS.map(plan => {
      const card = document.createElement("article");
      card.className = "plus-card";

      card.innerHTML = `
        <h3></h3>
        <div class="plus-price"></div>
        <div class="pack-price"></div>
        <div class="plus-robux"></div>
        <p class="note"></p>
        <button type="button" class="action"></button>
      `;

      card.querySelector("h3").textContent = plan.name;
      card.querySelector(".plus-price").textContent =
        usd(plan.cents / 100) + " " + t("month");

      card.querySelector(".plus-robux").textContent = plan.robux
        ? num(plan.robux, 0) + " " + t("monthlyRobux")
        : t("noRobux");

      card.querySelector(".note").textContent = t("benefits");

      const button = card.querySelector("button");

      button.addEventListener("click", () => {
        selectedPlus = plan.id;
        calculate();
        save();
      });

      $("plusTrack").appendChild(card);

      return {
        plan,
        card,
        button,
        price: card.querySelector(".pack-price")
      };
    });
  }

  function renderPurchase(targetId, item, amount, rate, subscription) {
    const box = $(targetId);
    box.hidden = !item;

    if (!item) {
      box.textContent = "";
      return;
    }

    const costUsd = item.cents / 100;
    const leftLocal = Math.max(0, amount - costUsd * rate);
    const leftUsd = Math.max(0, amount / rate - costUsd);

    box.innerHTML = `
      <h3></h3>
      <div class="purchase-row">
        <span class="item-label"></span>
        <strong class="item-value"></strong>
      </div>
      <div class="purchase-row">
        <span class="cost-label"></span>
        <strong class="cost-value"></strong>
      </div>
      <div class="remaining">
        <span class="label"></span>
        <div class="value"></div>
        <div class="note"></div>
      </div>
    `;

    box.querySelector("h3").textContent = t("selected");
    box.querySelector(".item-label").textContent =
      subscription ? "Roblox Plus" : "Robux";

    box.querySelector(".item-value").textContent =
      subscription ? item.name : num(item.robux, 0);

    box.querySelector(".cost-label").textContent = t("cost");
    box.querySelector(".cost-value").textContent =
      usd(costUsd) + " · ≈ " + local(costUsd * rate);

    box.querySelector(".remaining .label").textContent =
      t(subscription ? "firstMonth" : "left");

    box.querySelector(".remaining .value").textContent =
      "≈ " + local(leftLocal);

    box.querySelector(".remaining .note").textContent =
      "≈ " + usd(leftUsd);
  }

  function calculate() {
    const amount = parseDecimal($("amount").value, true);
    const rate = parseDecimal($("rate" + currency).value);

    const amountValid = Number.isFinite(amount) && amount >= 0;
    const rateValid = Number.isFinite(rate) && rate > 0;
    const budget = amountValid && rateValid ? amount / rate : NaN;
    const valid = Number.isFinite(budget);

    const cents = valid ? Math.floor(budget * 100 + 1e-7) : -1;
    const available = PACKS.filter(pack => pack.cents <= cents);

    let best = null;

    available.forEach(pack => {
      if (!best || pack.robux / pack.cents > best.robux / best.cents) {
        best = pack;
      }
    });

    let chosenPack = available.find(pack => pack.id === selectedPack);

    if (!chosenPack) {
      chosenPack = best;
      selectedPack = chosenPack ? chosenPack.id : null;
    }

    const chosenPlus = PLUS.find(plan =>
      plan.id === selectedPlus && plan.cents <= cents
    ) || null;

    if (!chosenPlus) selectedPlus = null;

    $("usdValue").textContent = valid ? usd(budget) : "—";
    $("bestValue").textContent = best
      ? num(best.robux, 0) + " R$"
      : "—";

    if (!amountValid) {
      $("inputStatus").textContent = t("invalidAmount");
    } else if (!rateValid || !valid) {
      $("inputStatus").textContent = t("invalidRate");
    } else if (amount > 0 && !best) {
      $("inputStatus").textContent = t("insufficient");
    } else {
      $("inputStatus").textContent = "";
    }

    packNodes.forEach(node => {
      const canBuy = node.pack.cents <= cents;
      const isBest = !!best && best.id === node.pack.id;
      const isSelected = !!chosenPack && chosenPack.id === node.pack.id;
      const priceUsd = node.pack.cents / 100;

      node.button.disabled = !canBuy;
      node.button.classList.toggle("best", isBest);
      node.button.classList.toggle("selected", isSelected);
      node.button.setAttribute("aria-pressed", String(isSelected));

      node.price.textContent = usd(priceUsd) +
        (rateValid ? " · ≈ " + local(priceUsd * rate) : "");

      node.badge.textContent = !canBuy
        ? t("unavailable")
        : isSelected
          ? t("chosen") + (isBest ? " · " + t("value") : "")
          : isBest ? t("value") : t("available");
    });

    plusNodes.forEach(node => {
      const canBuy = node.plan.cents <= cents;
      const isSelected = !!chosenPlus && chosenPlus.id === node.plan.id;

      node.card.classList.toggle("selected", isSelected);
      node.button.disabled = !canBuy;
      node.button.setAttribute("aria-pressed", String(isSelected));
      node.button.textContent = !canBuy
        ? t("unavailable")
        : isSelected ? t("chosen") : t("select");

      node.price.textContent = rateValid
        ? "≈ " + local(node.plan.cents / 100 * rate) + " " + t("month")
        : "—";
    });

    renderPurchase("packPurchase", chosenPack, amount, rate, false);
    renderPurchase("plusPurchase", chosenPlus, amount, rate, true);
  }

  function renderRateStatus() {
    $("refresh").disabled = loading;

    const messages = [];

    if (loading) messages.push(t("loading"));
    if (failed) messages.push(t("error"));

    if (manual.has(currency)) {
      messages.push(t("manual"));
    } else if (sourceTime) {
      let date;

      try {
        date = new Date(sourceTime).toLocaleString(lang);
      } catch (error) {
        date = new Date(sourceTime).toISOString();
      }

      messages.push(
        t(source === "cache" ? "cached" : "updated") + " " + date + "."
      );
    } else if (!loading) {
      messages.push(t("noRates"));
    }

    $("apiStatus").textContent = messages.join(" ");
  }

  function restoreRates() {
    const cache = read(CACHE_KEY);

    if (
      cache &&
      cache.rates &&
      Number.isFinite(cache.timestamp) &&
      cache.timestamp > 0 &&
      CODES.every(code =>
        Number.isFinite(cache.rates[code]) && cache.rates[code] > 0
      )
    ) {
      CODES.forEach(code => {
        $("rate" + code).value = cache.rates[code];
      });

      sourceTime = cache.timestamp;
      source = "cache";
    }

    if (saved.manualRates && typeof saved.manualRates === "object") {
      CODES.forEach(code => {
        if (typeof saved.manualRates[code] === "string") {
          $("rate" + code).value = saved.manualRates[code];
          manual.add(code);
        }
      });
    }
  }

  async function loadRates(force) {
    if (loading) return;

    loading = true;
    failed = false;
    renderRateStatus();

    const snapshot = Object.assign({}, versions);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);

    try {
      const response = await fetch(API, {
        signal: controller.signal
      });

      if (!response.ok) throw new Error("HTTP error");

      const data = await response.json();

      if (
        data.result !== "success" ||
        data.base_code !== "USD" ||
        !data.rates ||
        !CODES.every(code =>
          Number.isFinite(data.rates[code]) && data.rates[code] > 0
        ) ||
        !Number.isFinite(data.time_last_update_unix) ||
        data.time_last_update_unix <= 0
      ) {
        throw new Error("Invalid exchange rates");
      }

      const rates = {};
      CODES.forEach(code => {
        rates[code] = data.rates[code];

        const editedDuringRequest = versions[code] !== snapshot[code];

        if (!editedDuringRequest && (force || !manual.has(code))) {
          $("rate" + code).value = rates[code];
          manual.delete(code);
        }
      });

      source = "api";
      sourceTime = data.time_last_update_unix * 1000;

      write(CACHE_KEY, {
        rates,
        timestamp: sourceTime
      });

    } catch (error) {
      failed = true;
    } finally {
      clearTimeout(timer);
      loading = false;
      renderRateStatus();
      calculate();
      save();
    }
  }

  function applyLanguage() {
    document.documentElement.lang = lang;
    $("language").value = lang;

    document.querySelectorAll("[data-t]").forEach(element => {
      element.textContent = t(element.dataset.t);
    });

    buildPacks();
    buildPlus();
    calculate();
    renderRateStatus();
    configureClock();
  }

  $("amount").value =
    typeof saved.amount === "string" ? saved.amount : "";

  $("amount").addEventListener("input", () => {
    calculate();
    save();
  });

  $("amount").addEventListener("change", () => {
    calculate();
    save();
  });

  $("calculate").addEventListener("click", () => {
    calculate();
    save();
  });

  document.querySelectorAll("#currencies button").forEach(button => {
    button.addEventListener("click", () => {
      currency = button.dataset.currency;
      selectedPack = null;
      selectedPlus = null;
      applyCurrency();
      calculate();
      renderRateStatus();
      save();
    });
  });

  document.querySelectorAll("#themes button").forEach(button => {
    button.addEventListener("click", () => {
      theme = button.dataset.theme;
      applyTheme();
      save();
    });
  });

  CODES.forEach(code => {
    $("rate" + code).addEventListener("input", () => {
      manual.add(code);
      versions[code]++;
      calculate();
      renderRateStatus();
      save();
    });
  });

  $("refresh").addEventListener("click", () => {
    loadRates(true);
  });

  $("language").addEventListener("change", event => {
    lang = event.target.value;

    if (save()) {
      window.location.reload();
    } else {
      applyLanguage();
    }
  });

  function slide(direction) {
    const track = $("plusTrack");
    const firstCard = track.querySelector(".plus-card");

    if (!firstCard) return;

    const distance = firstCard.getBoundingClientRect().width + 12;
    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    track.scrollBy({
      left: direction * distance,
      behavior: reducedMotion ? "auto" : "smooth"
    });
  }

  $("plusPrevious").addEventListener("click", () => slide(-1));
  $("plusNext").addEventListener("click", () => slide(1));

  restoreRates();
  applyTheme();
  applyCurrency();
  applyLanguage();

  setInterval(updateClock, 1000);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      updateClock();
      calculate();
    }
  });

  loadRates(false);
})();
</script>
