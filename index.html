<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0e14"><title>Robux Calc v1.3</title>
<style>
:root{color-scheme:dark;--muted:#a6aaba;--line:#ffffff18;--accent:#acbaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#222842,transparent 60%),#0c0e14;color:#f3f4fb;font:15px system-ui,-apple-system,sans-serif;min-height:100vh}.app{max-width:560px;margin:auto;padding:24px 16px calc(30px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}h1{font-size:23px;letter-spacing:-1px}h2{font-size:17px;margin:0 0 16px}.card{background:#ffffff07;border:1px solid var(--line);border-radius:26px;padding:20px;margin-bottom:16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}button,input,select{font:inherit;color:inherit;border:1px solid var(--line);background:#ffffff08;border-radius:14px;padding:12px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}select{max-width:145px;background:#202330}.currencies{display:flex;gap:8px;margin:12px 0}.currencies button{flex:1}button.active{background:#d0d8ff;color:#111729}.label,.note{color:var(--muted);font-size:12px;line-height:1.65}.amount{width:100%;font-size:30px;margin:10px 0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.value{font-size:23px;font-weight:750;overflow-wrap:anywhere}.pack{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;padding:16px;background:#ffffff05;border-radius:19px}.pack small{display:block;color:var(--muted);margin-top:5px}.pack.selected{border-color:#a9baff;background:#7188ff19}.pack.unavailable{opacity:.5}.tag{font-size:11px;color:#b6f3d0}.price{text-align:right;white-space:nowrap}.carousel{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;padding:2px 2px 16px;scrollbar-color:#626b91 transparent}.plus{flex:0 0 245px;scroll-snap-align:start;display:flex;flex-direction:column;gap:12px;padding:20px;border:1px solid #b6a1ff40;border-radius:23px;background:linear-gradient(140deg,#9b7aff16,#ffffff04)}.plus h3{margin:0;font-size:21px}.plus .value{color:#ddd1ff}.plus button{margin-top:auto}.rate{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.rate input{width:130px}.receipt{margin-top:16px;background:#8c9fff12;border-radius:18px;padding:16px}.receipt p{margin:6px 0}footer{text-align:center;color:var(--muted);font-size:12px;padding:12px}a{color:var(--accent)}[hidden]{display:none!important}@media(max-width:370px){.card{padding:15px}.value{font-size:20px}.plus{flex-basis:220px}}
</style></head><body><main class="app">
<header><h1>◈ Robux Calc</h1><select id="language" aria-label="Language"><option value="ru">Русский</option><option value="en">English</option><option value="uk">Українська</option><option value="be">Беларуская</option></select></header>
<section class="card"><h2 data-t="budget"></h2><div class="currencies"><button data-c="BYN">BYN</button><button data-c="RUB">RUB</button><button data-c="UAH">UAH</button></div><label for="amount" class="label" data-t="enter"></label><input id="amount" class="amount" type="text" inputmode="decimal" placeholder="0"><div class="summary"><div><div class="label" data-t="usd"></div><div class="value" id="usd">—</div></div><div><div class="label" data-t="best"></div><div class="value" id="best">—</div></div></div></section>

<section class="card"><h2>Roblox Plus</h2><p class="note" data-t="swipe"></p><div id="plus" class="carousel" tabindex="0" aria-label="Roblox Plus"></div><p class="note" data-t="subscription"></p></section>
<section class="card" id="receiptSection"><h2 data-t="purchase"></h2><div class="receipt" id="receipt" aria-live="polite"></div></section>
<section class="card"><h2 data-t="rates"></h2><div id="rates"></div><p id="status" class="note" aria-live="polite"></p><button id="refresh" data-t="refresh"></button><p class="note" data-t="warning"></p><a class="note" href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates By Exchange Rate API</a></section>
<footer>Robux Calc · v1.3<br><span data-t="unofficial"></span><br><a href="https://www.roblox.com/upgrades/robux" target="_blank" rel="noopener" data-t="official"></a></footer>
</main><script>
const texts={

uk:{budget:'Твій бюджет',enter:'Сума у вибраній валюті',usd:'У доларах',best:'Вигідніше за $1',packs:'Пакети Robux',packNote:'Разові пакети з твого скриншота. Ціни й бонуси Roblox можуть відрізнятися залежно від регіону та акаунта.',swipe:'Гортай праворуч → Вибери підписку для розрахунку.',subscription:'Щомісячна підписка з автоматичним поновленням. Тут розраховано лише перший місяць. Сайт не здійснює покупок.',purchase:'Розрахунок вибраної покупки',rates:'Курс: місцева валюта за 1 USD',refresh:'Оновити курси',warning:'Довідковий курс постачальника оновлюється раз на добу. Курс банку, комісії та податки можуть відрізнятися. Якщо сталася помилка, введи курс вручну.',unofficial:'Неофіційний калькулятор, не пов’язаний із Roblox.',official:'Офіційний магазин Roblox',loading:'Завантажую курси…',loaded:'Курс постачальника від',error:'Не вдалося завантажити курси. Введи їх вручну або повтори запит.',manual:'Використовується ручний курс.',cached:'Збережений курс від',available:'Доступно',low:'Не вистачає',value:'Вигідно',selected:'Вибрано',per:'Robux за $1',monthly:'на місяць',benefits:'Переваги Roblox Plus',noRobux:'Без щомісячних Robux',choose:'Вибрати',needRate:'Дочекайся курсу або введи його вручну.',empty:'Вибери пакет або підписку.',cost:'Вартість',left:'Залишиться',missing:'Не вистачає',first:'Перший місяць',invalid:'Введи коректну невід’ємну суму.'},
be:{budget:'Твой бюджэт',enter:'Сума ў выбранай валюце',usd:'У доларах',best:'Выгадней за $1',packs:'Пакеты Robux',packNote:'Разавыя пакеты з твайго скрыншота. Цэны і бонусы Roblox могуць адрознівацца паводле рэгіёна і акаўнта.',swipe:'Гартай управа → Выберы падпіску для разліку.',subscription:'Штомесячная падпіска з аўтападаўжэннем. Тут разлічваецца толькі першы месяц. Сайт не ажыццяўляе пакупак.',purchase:'Разлік выбранай пакупкі',rates:'Курс: мясцовая валюта за 1 USD',refresh:'Абнавіць курсы',warning:'Даведачны курс пастаўшчыка абнаўляецца раз на суткі. Курс банка, камісіі і падаткі могуць адрознівацца. Пры памылцы ўвядзі курс уручную.',unofficial:'Неафіцыйны калькулятар, не звязаны з Roblox.',official:'Афіцыйная крама Roblox',loading:'Загружаю курсы…',loaded:'Курс пастаўшчыка ад',error:'Не ўдалося загрузіць курсы. Увядзі іх уручную або паўтары запыт.',manual:'Выкарыстоўваецца ручны курс.',cached:'Захаваны курс ад',available:'Даступна',low:'Не хапае',value:'Выгадна',selected:'Выбрана',per:'Robux за $1',monthly:'на месяц',benefits:'Перавагі Roblox Plus',noRobux:'Без штомесячных Robux',choose:'Выбраць',needRate:'Дачакайся курсу або ўвядзі яго ўручную.',empty:'Выберы пакет або падпіску.',cost:'Кошт',left:'Застанецца',missing:'Не хапае',first:'Першы месяц',invalid:'Увядзі карэктную неадмоўную суму.'}
};
const packs=[[40,49],[80,99],[400,499],[800,999],[1200,1499],[1700,1999],[3150,3499],[4500,4999],[10000,9999],[22500,19999]].map(([robux,cents],i)=>({id:'p'+i,name:robux+' Robux',robux,cents}));
const subscriptions=[['Roblox Plus',0,499],['Plus 500',500,899],['Plus 1000',1000,1299],['Plus 2000',2000,2199]].map(([name,robux,cents],i)=>({id:'s'+i,name,robux,cents,subscription:true}));
const $=id=>document.getElementById(id), currencies=['BYN','RUB','UAH'];
let lang='ru',currency='BYN',rates={},selected=null,status='loading',updated=null,loading=false,manualEdits=new Set();
try{let saved=localStorage.getItem('robuxLanguage');if(texts[saved])lang=saved;let cache=JSON.parse(localStorage.getItem('robuxRates'));if(cache&&currencies.every(c=>Number.isFinite(cache.rates[c])&&cache.rates[c]>0)){rates=cache.rates;updated=cache.updated;status='cached';}}catch(e){}
const t=k=>texts[lang][k];
const money=(n,c=currency)=>new Intl.NumberFormat(lang,{style:'currency',currency:c}).format(n);
const num=n=>new Intl.NumberFormat(lang,{maximumFractionDigits:1}).format(n);
function validRate(){return Number.isFinite(rates[currency])&&rates[currency]>0}
function budget(){let raw=$('amount').value.trim().replace(',','.');let n=raw===''?0:Number(raw);return Number.isFinite(n)&&n>=0?n:NaN}
function centsBudget(){return validRate()&&Number.isFinite(budget())?Math.floor((budget()/rates[currency])*100+1e-8):null}
function renderStatus(){let date=updated?new Date(updated*1000).toLocaleString(lang):'';$('status').textContent=t(status)+(status==='loaded'||status==='cached'?' '+date:'');$('refresh').disabled=loading;}
function render(){document.documentElement.lang=lang;$('language').value=lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));document.querySelectorAll('[data-c]').forEach(b=>{b.classList.toggle('active',b.dataset.c===currency);b.setAttribute('aria-pressed',b.dataset.c===currency)});renderStatus();calculate();}
function calculate(){const rate=rates[currency],local=budget(),bc=centsBudget();const best=bc===null?null:packs.filter(p=>p.cents<=bc).reduce((a,b)=>!a||b.robux/b.cents>a.robux/a.cents?b:a,null);$('usd').textContent=bc===null?'—':money(local/rate,'USD');$('best').textContent=best?num(best.robux)+' R$':'—';
$('packs').replaceChildren();packs.forEach(p=>{const can=bc!==null&&p.cents<=bc,b=document.createElement('button');b.type='button';b.className='pack'+(!can?' unavailable':'')+(selected?.id===p.id?' selected':'');b.setAttribute('aria-pressed',selected?.id===p.id?'true':'false');b.innerHTML=`<span><strong>${num(p.robux)} Robux</strong><small>${num(p.robux/(p.cents/100))} ${t('per')}</small><span class="tag">${selected?.id===p.id?t('selected'):best?.id===p.id?t('value'):can?t('available'):t('low')}</span></span><span class="price">${money(p.cents/100,'USD')}<small>${validRate()?money(p.cents/100*rate):'—'}</small></span>`;b.onclick=()=>{selected=p;calculate()};$('packs').append(b)});
$('plus').querySelectorAll('[data-id]').forEach(el=>{const p=subscriptions.find(p=>p.id===el.dataset.id);el.querySelector('.local').textContent=validRate()?money(p.cents/100*rate):'—';el.querySelector('button').textContent=selected?.id===p.id?t('selected'):t('choose');el.querySelector('button').classList.toggle('active',selected?.id===p.id)});
if(!Number.isFinite(local)){$('receipt').textContent=t('invalid');return}if(!validRate()){$('receipt').textContent=t('needRate');return}if(!selected){$('receipt').textContent=t('empty');return}const cost=selected.cents/100*rate,diff=local-cost,affordable=bc>=selected.cents;$('receipt').innerHTML=`<p><strong>${selected.name}</strong>${selected.subscription?' · '+t('first'):''}</p><p>${t('cost')}: ${money(cost)} · ${money(selected.cents/100,'USD')}</p><p>${affordable?t('left'):t('missing')}: <strong>${money(Math.abs(diff))}</strong> · ${money(Math.abs(local/rate-selected.cents/100),'USD')}</p>`;
}
function buildPlus(){const scroll=$('plus').scrollLeft;$('plus').replaceChildren();subscriptions.forEach(p=>{const card=document.createElement('article');card.className='plus';card.dataset.id=p.id;card.innerHTML=`<h3>${p.name}</h3><div class="value">${money(p.cents/100,'USD')}</div><div class="label">${t('monthly')}</div><strong>${p.robux?num(p.robux)+' Robux / '+t('monthly'):t('noRobux')}</strong><div class="note">${t('benefits')}</div><div class="local note"></div><button type="button">${t('choose')}</button>`;card.querySelector('button').onclick=()=>{selected=p;calculate()};$('plus').append(card)});$('plus').scrollLeft=scroll;}
currencies.forEach(c=>{const row=document.createElement('div');row.className='rate';const label=document.createElement('label');label.htmlFor='rate'+c;label.textContent='1 USD = '+c;const input=document.createElement('input');input.id='rate'+c;input.type='number';input.min='0.000001';input.step='any';input.placeholder='—';input.inputMode='decimal';input.value=rates[c]||'';input.oninput=()=>{manualEdits.add(c);rates[c]=Number(input.value);status='manual';renderStatus();calculate()};row.append(label,input);$('rates').append(row)});
$('amount').oninput=calculate;
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{currency=b.dataset.c;render()});
$('language').onchange=e=>{lang=e.target.value;try{localStorage.setItem('robuxLanguage',lang)}catch(e){}buildPlus();render()};
async function loadRates(){if(loading)return;loading=true;status='loading';renderStatus();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch('https://open.er-api.com/v6/latest/USD',{signal:controller.signal});if(!response.ok)throw Error('HTTP');const data=await response.json();if(data.result!=='success'||!currencies.every(c=>Number.isFinite(data.rates?.[c])&&data.rates[c]>0))throw Error('Invalid rates');updated=data.time_last_update_unix;currencies.forEach(c=>{if(!manualEdits.has(c)){rates[c]=data.rates[c];$('rate'+c).value=rates[c]}});status=manualEdits.size?'manual':'loaded';try{localStorage.setItem('robuxRates',JSON.stringify({rates:data.rates,updated}))}catch(e){}}catch(e){status=manualEdits.size?'manual':updated?'cached':'error'}finally{clearTimeout(timer);loading=false;renderStatus();calculate()}}
$('refresh').onclick=()=>{manualEdits.clear();loadRates()};buildPlus();render();loadRates();
</script></body></html>
<style>
  .capital-clock {
    max-width: 480px;
    margin: 20px auto 0;
    padding: 18px 16px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.20);
  }

  .capital-clock-label {
    margin-bottom: 8px;
    color: #98a2b3;
    font-size: 12px;
    font-weight: 600;
  }

  .capital-clock-time {
    display: block;
    color: #f2f4f7;
    font-family: inherit;
    font-size: clamp(18px, 5vw, 23px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
</style>

<footer class="capital-clock">
  <div id="capitalClockLabel" class="capital-clock-label"></div>
  <time id="capitalClockTime" class="capital-clock-time"></time>
</footer>

<script>
(() => {
  const cities = {
    ru: {
      zone: "Europe/Moscow",
      label: "Москва · время столицы"
    },
    be: {
      zone: "Europe/Minsk",
      label: "Мінск · час сталіцы"
    },
    uk: {
      zone: "Europe/Kyiv",
      label: "Київ · час столиці"
    },
en: {
  zone: "America/New_York",
  label: "Washington, D.C. · capital time"
}
  };

  const languageSelect = document.getElementById("lang");
  const label = document.getElementById("capitalClockLabel");
  const clock = document.getElementById("capitalClockTime");

  let formatter;

  function updateClock() {
    const now = new Date();

    const parts = Object.fromEntries(
      formatter.formatToParts(now).map(part => [
        part.type,
        part.value
      ])
    );

    clock.textContent =
      `${parts.day}:${parts.month}:${parts.year} ` +
      `${parts.hour}:${parts.minute}:${parts.second}`;

    clock.dateTime = now.toISOString();
  }

  function changeClockLanguage() {
    const language =
      languageSelect?.value || document.documentElement.lang;

    const city = cities[language] || cities.ru;

    label.textContent = city.label;

    formatter = new Intl.DateTimeFormat("en-GB", {
      timeZone: city.zone,
      numberingSystem: "latn",
      day: "2-digit",
      month: "2-digit",
      year: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    });

    updateClock();
  }

  languageSelect?.addEventListener("change", changeClockLanguage);

  changeClockLanguage();
  setInterval(updateClock, 1000);
})();
</script>
