<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Robux Calc</title>

<style>
:root {
  color-scheme: dark;
  --bg: #0b0d10;
  --card: rgba(255,255,255,.055);
  --border: rgba(255,255,255,.10);
  --text: #f2f4f7;
  --muted: #a1a9b8;
  --accent: #b9caff;
  --green: #a5f3c4;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100dvh;
  padding: 20px 14px calc(30px + env(safe-area-inset-bottom));
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(650px 450px at 0% 0%, #7c9cff20, transparent 65%),
    radial-gradient(600px 450px at 100% 15%, #9d7cff18, transparent 65%),
    var(--bg);
}

button, input, select {
  font: inherit;
}

button, select {
  cursor: pointer;
}

button, input, select, a {
  -webkit-tap-highlight-color: transparent;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.app {
  max-width: 540px;
  margin: auto;
}

.header {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -.4px;
}

.logo-icon {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  color: #10131a;
  background: linear-gradient(135deg, #c7d5ff, #a58aff);
}

.clock {
  flex: 1;
  min-width: 0;
  padding: 9px 6px;
  text-align: center;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--card);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.clock-city {
  margin-bottom: 4px;
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.clock-time {
  display: block;
  white-space: nowrap;
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.language {
  width: 104px;
  flex-shrink: 0;
  padding: 12px 6px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #191d25;
  color: var(--text);
  font-size: 12px;
}

.card {
  margin-bottom: 14px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 25px;
  background: var(--card);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 18px 45px #00000026;
}

.title {
  margin: 0 0 13px;
  font-size: 14px;
  font-weight: 650;
  color: var(--muted);
}

.currencies {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 18px;
}

.currency {
  min-height: 45px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: #ffffff05;
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

.currency.active {
  color: #11141b;
  background: linear-gradient(135deg, #c8d4ff, #ffffff);
  border-color: transparent;
}

.amount-box {
  position: relative;
}

.amount {
  width: 100%;
  padding: 17px 65px 17px 16px;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: #ffffff06;
  color: var(--text);
  font-size: 27px;
  font-weight: 700;
}

.symbol {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-weight: 700;
}

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 14px;
}

.summary-item, .purchase {
  padding: 15px;
  border-radius: 17px;
  background: #7c9cff10;
  border: 1px solid #7c9cff26;
}

.label {
  display: block;
  margin-bottom: 7px;
  color: var(--accent);
  font-size: 11px;
  line-height: 1.4;
}

.value {
  font-size: 21px;
  font-weight: 800;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

.note {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.packs {
  display: grid;
  gap: 9px;
}

.pack {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 14px 12px;
  text-align: left;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 18px;
  background: #ffffff04;
  transition: border-color .15s, background .15s;
}

.pack:disabled {
  cursor: default;
  opacity: .55;
}

.pack.best {
  border-color: #4ade8055;
  background: #4ade8009;
}

.pack.selected {
  border-color: #b9caff;
  background: #7c9cff16;
}

.pack-icon {
  width: 35px;
  height: 35px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 11px;
  background: #7c9cff18;
  color: var(--accent);
  font-size: 13px;
  font-weight: 800;
}

.pack-info {
  flex: 1;
  min-width: 0;
}

.pack-name {
  font-size: 16px;
  font-weight: 750;
}

.pack-price, .pack-rate {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
}

.badge {
  max-width: 94px;
  padding: 6px 8px;
  border-radius: 12px;
  color: var(--green);
  background: #4ade8010;
  font-size: 10px;
  line-height: 1.4;
  text-align: center;
}

.pack:disabled .badge {
  color: #c6cbd5;
  background: #ffffff08;
}

.purchase {
  margin-top: 16px;
}

.purchase h3 {
  margin: 0 0 12px;
  font-size: 15px;
}

.purchase-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 11px;
  font-size: 13px;
}

.purchase-row span {
  color: var(--muted);
}

.purchase-row strong {
  text-align: right;
  font-weight: 700;
}

.remainder {
  margin-top: 15px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.remainder .value {
  color: var(--green);
}

.rates-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

.rates-header .title {
  margin: 0;
}

.refresh {
  min-height: 36px;
  padding: 7px 11px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #ffffff06;
  color: var(--accent);
  font-size: 12px;
}

.refresh:disabled {
  opacity: .5;
  cursor: wait;
}

.rate-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 10px;
}

.rate-row label {
  color: var(--muted);
  font-size: 13px;
}

.rate-input {
  width: 135px;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #ffffff06;
  color: var(--text);
  text-align: right;
  font-size: 15px;
}

.source {
  display: block;
  margin-top: 12px;
  color: var(--accent);
  font-size: 11px;
  text-decoration: none;
}

.footer {
  padding: 5px 8px;
  text-align: center;
}

[hidden] {
  display: none !important;
}

@media (max-width: 380px) {
  .header {
    flex-wrap: wrap;
  }

  .logo {
    flex: 1;
  }

  .clock {
    flex: 0 0 100%;
    order: 3;
  }

  .clock-time {
    font-size: 14px;
  }

  .card {
    padding: 15px;
  }

  .value {
    font-size: 18px;
  }

  .pack {
    gap: 8px;
    padding: 12px 9px;
  }

  .pack-icon {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
</style>
</head>

<body>
<main class="app">

  <header class="header">
    <div class="logo">
      <span class="logo-icon" aria-hidden="true">R$</span>
      Robux Calc
    </div>

    <div class="clock">
      <div id="clockCity" class="clock-city"></div>
      <time id="clockTime" class="clock-time"></time>
    </div>

    <select id="language" class="language" aria-label="Language">
      <option value="ru">Русский</option>
      <option value="en">English</option>
      <option value="uk">Українська</option>
      <option value="be">Беларуская</option>
    </select>
  </header>

  <section class="card">
    <h2 class="title" data-t="currency"></h2>

    <div class="currencies">
      <button type="button" class="currency" data-currency="BYN">BYN</button>
      <button type="button" class="currency" data-currency="RUB">RUB</button>
      <button type="button" class="currency" data-currency="UAH">UAH</button>
    </div>

    <label class="title" for="amount" data-t="amount"
      style="display:block"></label>

    <div class="amount-box">
      <input
        id="amount"
        class="amount"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        placeholder="0"
      >
      <span id="symbol" class="symbol"></span>
    </div>

    <div class="summary">
      <div class="summary-item">
        <span class="label" data-t="usd"></span>
        <div id="usdValue" class="value">—</div>
      </div>

      <div class="summary-item">
        <span class="label" data-t="best"></span>
        <div id="bestValue" class="value">—</div>
      </div>
    </div>

    <p class="note" data-t="bestHint"></p>
    <p id="inputStatus" class="note" role="status"></p>
  </section>

  <section class="card">
    <h2 class="title" data-t="packs"></h2>
    <p class="note" data-t="selectHint" style="margin:0 0 14px"></p>

    <div id="packs" class="packs"></div>

    <section id="purchase" class="purchase" hidden>
      <h3 data-t="selected"></h3>

      <div class="purchase-row">
        <span>Robux</span>
        <strong id="selectedRobux"></strong>
      </div>

      <div class="purchase-row">
        <span data-t="cost"></span>
        <strong id="selectedCost"></strong>
      </div>

      <div class="remainder">
        <span class="label" data-t="left"></span>
        <div id="leftLocal" class="value"></div>
        <div id="leftUsd" class="note"></div>
      </div>
    </section>
  </section>

  <section class="card">
    <div class="rates-header">
      <h2 class="title" data-t="rates"></h2>
      <button id="refresh" type="button" class="refresh" data-t="refresh"></button>
    </div>

    <div class="rate-row">
      <label for="rateBYN">1 USD = BYN</label>
      <input id="rateBYN" class="rate-input"
        type="number" min="0.000001" step="any" placeholder="—">
    </div>

    <div class="rate-row">
      <label for="rateRUB">1 USD = RUB</label>
      <input id="rateRUB" class="rate-input"
        type="number" min="0.000001" step="any" placeholder="—">
    </div>

    <div class="rate-row">
      <label for="rateUAH">1 USD = UAH</label>
      <input id="rateUAH" class="rate-input"
        type="number" min="0.000001" step="any" placeholder="—">
    </div>

    <p id="apiStatus" class="note" role="status"></p>
    <p class="note" data-t="rateHint"></p>

    <a class="source"
       href="https://www.exchangerate-api.com"
       target="_blank"
       rel="noopener noreferrer">
      Rates By ExchangeRate-API
    </a>
  </section>

  <footer class="footer">
    <p class="note" data-t="disclaimer"></p>
    <a class="source"
       href="https://www.roblox.com/upgrades/robux"
       target="_blank"
       rel="noopener noreferrer"
       data-t="openRoblox"></a>
  </footer>

</main>

function readStorage(key) {
  try {
    return JSON.parse(localStorage.getItem(key));
  } catch {
    return null;
  }
}

function writeStorage(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch {
    return false;
  }
}

}

function money(value) {
  return "$" + number(value);
}

function localMoney(value) {
  return number(value) + " " + currency;
}

function getManualRates() {
  const result = {};

  manualCurrencies.forEach(code => {
    const value = Number($("rate" + code).value);
    if (Number.isFinite(value) && value > 0) {
      result[code] = value;
    }
  });

  return result;
}

function saveState() {
  return writeStorage(STATE_KEY, {
    language,
    currency,
    amount: $("amount").value,
    selectedCents,
    manualRates: getManualRates()
  });
}

function applyLanguage() {
  document.documentElement.lang = language;
  $("language").value = language;

  document.querySelectorAll("[data-t]").forEach(element => {
    element.textContent = t(element.dataset.t);
  });

  $("amount").setAttribute("aria-label", t("amount"));
  $("clockCity").textContent = CITIES[language].name;

  clockFormatter = new Intl.DateTimeFormat("en-GB", {
    timeZone: CITIES[language].zone,
    numberingSystem: "latn",
    day: "2-digit",
    month: "2-digit",
    year: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  });

  updateClock();
  buildPacks();
  renderRateStatus();
  calculate();
}

function updateClock() {
  const now = new Date();

  const parts = Object.fromEntries(
    clockFormatter.formatToParts(now).map(part => [
      part.type,
      part.value
    ])
  );

  $("clockTime").textContent =
    `${parts.day}:${parts.month}:${parts.year} ` +
    `${parts.hour}:${parts.minute}:${parts.second}`;

  $("clockTime").dateTime = now.toISOString();
}

function buildPacks() {
  $("packs").replaceChildren();

  packNodes = PACKS.map(pack => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "pack";

    button.innerHTML = `
      <span class="pack-icon" aria-hidden="true">R$</span>
      <div class="pack-info">
        <div class="pack-name"></div>
        <div class="pack-price"></div>
        <div class="pack-rate"></div>
      </div>
      <span class="badge"></span>
    `;

    button.querySelector(".pack-name").textContent =
      number(pack.robux, 0) + " Robux";

    button.querySelector(".pack-rate").textContent =
      number(pack.robux / (pack.cents / 100), 1) +
      " " + t("perDollar");

    button.addEventListener("click", () => {
      selectedCents = pack.cents;
      calculate();
      saveState();
    });

    $("packs").append(button);

    return {
      pack,
      button,
      price: button.querySelector(".pack-price"),
      badge: button.querySelector(".badge")
    };
  });
}

function getAmount() {
  const text = $("amount").value
    .trim()
    .replace(/s/g, "")
    .replace(",", ".");

  if (!text) return 0;

  if (!/^d+(?:.d*)?$/.test(text)) return NaN;

  const value = Number(text);

  return Number.isFinite(value) ? value : NaN;
}

function getRate() {
  const value = Number($("rate" + currency).value);

  return Number.isFinite(value) && value > 0
    ? value
    : NaN;
}

function calculate() {
  const amount = getAmount();
  const rate = getRate();

  const validAmount = Number.isFinite(amount) && amount >= 0;
  const validRate = Number.isFinite(rate) && rate > 0;
  const valid = validAmount && validRate;

  const usd = valid ? amount / rate : NaN;
  const budgetCents = valid
    ? Math.floor(usd * 100 + 0.0000001)
    : -1;

  const available = PACKS.filter(pack => pack.cents <= budgetCents);

  const best = available.reduce((current, pack) => {
    if (!current) return pack;

    return pack.robux / pack.cents > current.robux / current.cents
      ? pack
      : current;
  }, null);

  let selected = available.find(pack => pack.cents === selectedCents);

  if (!selected) {
    selected = best;
    selectedCents = selected ? selected.cents : null;
  }

  $("usdValue").textContent = valid ? money(usd) : "—";
  $("bestValue").textContent = best
    ? number(best.robux, 0) + " R$"
    : "—";

  if (!validAmount) {
    $("inputStatus").textContent = t("invalidAmount");
  } else if (!validRate) {
    $("inputStatus").textContent = t("invalidRate");
  } else if (!best && amount > 0) {
    $("inputStatus").textContent = t("insufficient");
  } else {
    $("inputStatus").textContent = "";
  }

  packNodes.forEach(({ pack, button, price, badge }) => {
    const canBuy = valid && pack.cents <= budgetCents;
    const isBest = !!best && best.cents === pack.cents;
    const isSelected = !!selected && selected.cents === pack.cents;
    const usdPrice = pack.cents / 100;

    button.disabled = !canBuy;
    button.classList.toggle("best", isBest);
    button.classList.toggle("selected", isSelected);
    button.setAttribute("aria-pressed", String(isSelected));

    price.textContent = money(usdPrice) +
      (validRate ? " · ≈ " + localMoney(usdPrice * rate) : "");

    badge.textContent = !canBuy
      ? t("unavailable")
      : isSelected
        ? t("chosen") + (isBest ? " · " + t("value") : "")
        : isBest
          ? t("value")
          : t("available");
  });

  $("purchase").hidden = !selected;

  if (selected) {
    const costUsd = selected.cents / 100;
    const remainingLocal = Math.max(0, amount - costUsd * rate);

    $("selectedRobux").textContent = number(selected.robux, 0);
    $("selectedCost").textContent =
      money(costUsd) + " · ≈ " + localMoney(costUsd * rate);

    $("leftLocal").textContent = "≈ " + localMoney(remainingLocal);
    $("leftUsd").textContent = "≈ " + money(Math.max(0, usd - costUsd));
  }
}

function syncCurrency() {
  document.querySelectorAll("[data-currency]").forEach(button => {
    const active = button.dataset.currency === currency;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });

  $("symbol").textContent = SYMBOLS[currency];
}

function renderRateStatus() {
  $("refresh").disabled = loading;

  const messages = [];

  if (loading) messages.push(t("loading"));
  if (refreshFailed) messages.push(t("error"));

  if (manualCurrencies.has(currency)) {
    messages.push(t("manual"));
  } else if (rateSource !== "none" && rateDate) {
    const label = rateSource === "cache" ? t("cached") : t("updated");

    const formattedDate = new Intl.DateTimeFormat(language, {
      dateStyle: "short",
      timeStyle: "short"
    }).format(new Date(rateDate));

    messages.push(label + " " + formattedDate + ".");
  } else if (!loading) {
    messages.push(t("noRates"));
  }

  $("apiStatus").textContent = messages.join(" ");
}

function restoreRates() {
  const cache = readStorage(CACHE_KEY);

  if (
    cache &&
    cache.rates &&
    Number.isFinite(cache.timestamp) &&
    CURRENCIES.every(code =>
      Number.isFinite(cache.rates[code]) && cache.rates[code] > 0
    )
  ) {
    rates = cache.rates;
    rateDate = cache.timestamp;
    rateSource = "cache";

    CURRENCIES.forEach(code => {
      $("rate" + code).value = rates[code];
    });
  }

  const manualRates = savedState.manualRates || {};

  CURRENCIES.forEach(code => {
    const value = Number(manualRates[code]);

    if (Number.isFinite(value) && value > 0) {
      $("rate" + code).value = value;
      manualCurrencies.add(code);
    }
  });
}

async function loadRates(force = false) {
  if (loading) return;

  loading = true;
  refreshFailed = false;
  renderRateStatus();

  const editSnapshot = { ...rateEditVersion };
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);

  try {
    const response = await fetch(API_URL, {
      signal: controller.signal
    });

    if (!response.ok) throw new Error("HTTP error");

    const data = await response.json();

    if (
      data.result !== "success" ||
      !data.rates ||
      !CURRENCIES.every(code =>
        Number.isFinite(data.rates[code]) && data.rates[code] > 0
      ) ||
      !Number.isFinite(data.time_last_update_unix) ||
      data.time_last_update_unix <= 0
    ) {
      throw new Error("Invalid rates");
    }

    rates = Object.fromEntries(
      CURRENCIES.map(code => [code, data.rates[code]])
    );

    rateDate = data.time_last_update_unix * 1000;
    rateSource = "api";

    CURRENCIES.forEach(code => {
      const editedDuringRequest =
        rateEditVersion[code] !== editSnapshot[code];

      if (
        !editedDuringRequest &&
        (force || !manualCurrencies.has(code))
      ) {
        $("rate" + code).value = rates[code];
        manualCurrencies.delete(code);
      }
    });

    writeStorage(CACHE_KEY, {
      rates,
      timestamp: rateDate
    });

  } catch (error) {
    refreshFailed = true;
  } finally {
    clearTimeout(timeout);
    loading = false;
    renderRateStatus();
    calculate();
    saveState();
  }
}

$("amount").value =
  typeof savedState.amount === "string" ? savedState.amount : "";

restoreRates();
syncCurrency();
applyLanguage();

$("amount").addEventListener("input", () => {
  calculate();
  saveState();
});

document.querySelectorAll("[data-currency]").forEach(button => {
  button.addEventListener("click", () => {
    currency = button.dataset.currency;
    selectedCents = null;
    syncCurrency();
    renderRateStatus();
    calculate();
    saveState();
  });
});

CURRENCIES.forEach(code => {
  $("rate" + code).addEventListener("input", () => {
    manualCurrencies.add(code);
    rateEditVersion[code]++;
    renderRateStatus();
    calculate();
    saveState();
  });
});

$("language").addEventListener("change", event => {
  language = event.target.value;

  if (saveState()) {
    window.location.reload();
  } else {
    applyLanguage();
  }
});

$("refresh").addEventListener("click", () => {
  loadRates(true);
});

setInterval(updateClock, 1000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) updateClock();
});

loadRates();
</script>
</body>
</html>
